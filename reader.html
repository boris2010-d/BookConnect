<!doctype html><html lang="bg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF четец — BookConnect</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="reader.css"><script src="reader.js" defer></script></head><body><header><div class="container nav"><a class="logo" href="index.html">📖 Book<span>Connect</span></a><nav><a href="premium.html">Premium</a><a href="index.html#catalog">Каталог</a></nav></div></header><main class="container"><section class="reader-section"><h1>Чети PDF онлайн</h1><p>Избери PDF файл от устройството си. Файлът се отваря само в браузъра и не се качва на сървър.</p><label for="pdfFile">Избери PDF книга</label><input type="file" id="pdfFile" accept="application/pdf,.pdf"><p id="readerStatus" role="status">Няма избран файл.</p><div id="readerControls" hidden><button class="btn btn-outline" id="previousPage" type="button">← Предишна</button><span id="pageIndicator" aria-live="polite"></span><button class="btn btn-outline" id="nextPage" type="button">Следваща →</button><button class="btn btn-outline" id="zoomOut" type="button">−</button><button class="btn btn-outline" id="zoomIn" type="button">+</button></div><div id="pageContainer"><canvas id="pdfCanvas" aria-label="PDF страница"></canvas></div><p class="reader-note">Прогресът се запазва само за този браузър. Използвай книги, за които имаш право на четене и разпространение.</p></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script></body></html>
