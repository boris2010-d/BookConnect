name: Redesign browser preview
on:
  push:
    branches: [feature/bookconnect-redesign]
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/preview-redesign.mjs
      - name: Upload actual preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookconnect-redesign-screenshots
          path: preview-screenshots/
          if-no-files-found: warn
