name: Stage 2 static checks
on:
  push:
    branches: [main, feature/bookconnect-redesign]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check-stage2.mjs
      - run: node tests/check-stage3.mjs
