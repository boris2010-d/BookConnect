
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookConnect — Училищна библиотека</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>📚 BookConnect</h1>
        <nav>
            <a href="#catalog">Каталог</a>
            <a href="#about">За проекта</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Открий следващата си книга!</h2>
            <p>Търси книги в училищната библиотека.</p>
            <input
                type="search"
                id="search"
                placeholder="Търси по заглавие или автор..."
                aria-label="Търсене на книги"
            >
        </section>

        <section id="catalog">
            <h2>Каталог с книги</h2>
            <div id="book-list"></div>
        </section>

        <section id="about">
            <h2>За BookConnect</h2>
            <p>
                BookConnect е проект за управление
                на училищна библиотека.
            </p>
        </section>
    </main>

    <footer>
        <p>BookConnect — Училищен проект</p>
    </footer>
</body>
</html>
